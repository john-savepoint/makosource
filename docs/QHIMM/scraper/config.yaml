# SMF URL patterns
url_patterns:
  board: "?board={board_id}.{offset}"
  topic: "?topic={topic_id}.{offset}"
  # Pagination: offset increments by 50 for topics list, 20 for posts in topic

# Pagination settings
pagination:
  topics_per_page: 20
  posts_per_page: 20

# Content extraction selectors (SMF 2.0 structure)
selectors:
  # Board page selectors
  topic_list: "table.table_grid tbody tr"
  topic_link: "td.subject a[href*='topic=']"
  topic_replies: "td.stats"
  topic_views: "td.stats"
  topic_lastpost: "td.lastpost"

  # Topic page selectors
  post_container: "div.post_wrapper"
  post_author: "div.poster h4 a"
  post_date: "div.smalltext"
  post_content: "div.post div.inner"
  post_signature: "div.signature"

  # Pagination
  page_links: "div.pagelinks a.navPages"
  current_page: "div.pagelinks strong"

# Output settings
output:
  raw_html_dir: "../raw"
  markdown_dir: "../markdown"
  topics_dir: "../topics"
  database_path: "../database/qhimm.db"
